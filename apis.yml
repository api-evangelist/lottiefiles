aid: lottiefiles
name: LottieFiles
description: >-
  LottieFiles is the platform and open-source runtime ecosystem for Lottie and dotLottie
  — a lightweight, JSON-based vector animation format that ships motion on any platform as
  easily as a static asset. Rather than a hosted HTTP API, LottieFiles' developer surface is
  a family of first-party, Rust+WASM-powered "dotLottie" players and framework/native
  components (Web, React, Vue, Svelte, Solid, React Native, iOS, Android, Flutter), plus
  embeddable web components and design-tool plugins for Adobe After Effects, Figma, Canva,
  VSCode, Framer and Webflow, letting developers render and control animations client-side.
