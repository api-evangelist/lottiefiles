  first-party client runtimes ("dotLottie players") that render Lottie / dotLottie
  animations across web and native platforms. The JavaScript/web family is published
  under the @lottiefiles npm org (names + latest versions verified against
  registry.npmjs.org on 2026-07-20). Native players are published from the LottieFiles
  GitHub org; their repos are confirmed, exact registry coordinates are referenced to
  the repo rather than asserted.
